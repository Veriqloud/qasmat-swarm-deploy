---
- name: Check if overlay network 'my-overlay-net' exists
  ansible.builtin.command: docker network inspect my-overlay-net
  register: network_check
  failed_when: false
  changed_when: false

- name: Create overlay network 'my-overlay-net' if it does not exist
  ansible.builtin.command: docker network create --driver=overlay --attachable --opt encrypted --opt mtu=1400 my-overlay-net
  when: network_check.rc != 0

- name: Copy web-client docker-compose.yml
  ansible.builtin.template:
    src: docker-compose-web.yml.j2
    dest: /qasmat-swarm/docker-compose-web.yml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Deploy Web Client Stack using command
  ansible.builtin.command: >
    docker stack deploy -c /qasmat-swarm/docker-compose-web.yml web-client
